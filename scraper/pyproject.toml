[project]
name = "terpsdining-scraper"
version = "0.1.0"
description = "UMD dining menus, nutrition, hours, and food images"
authors = [
    { name = "sbharga", email = "hello@shreyas.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.1",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "supabase>=2.34.1",
]

[project.scripts]
terpsdining-thumbnails = "terpsdining_scraper.thumbnails:main"
terpsdining-scrape = "terpsdining_scraper.main:main"
terpsdining-names = "terpsdining_scraper.names:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
