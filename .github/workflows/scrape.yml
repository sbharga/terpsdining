name: Daily dining data
on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      date:
        description: Start date (YYYY-MM-DD)
        type: string
        required: false
      days:
        description: Days to scrape
        type: string
        default: "1"
concurrency:
  group: scrape
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: scraper/uv.lock
      - run: uv run --frozen terpsdining-scrape
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCRAPE_DATE: ${{ inputs.date }}
          SCRAPE_DAYS: ${{ inputs.days }}
      - name: Rebuild site
        if: ${{ !cancelled() && env.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
